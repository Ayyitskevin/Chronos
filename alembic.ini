# Chronos database migrations. The supported upgrade path is:
#   v2 (pre-live-wheel) --0002--> v3 (order-intent pipeline tables)
# Fresh databases never need alembic: Database.initialize() creates the
# current schema directly. DATABASE_URL (env) overrides sqlalchemy.url.
[alembic]
script_location = src/chronos/persistence/migrations
sqlalchemy.url = sqlite:///data/chronos.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
