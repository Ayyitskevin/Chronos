[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chronos"
version = "0.1.0"
description = "Local-first Wheel Strategy decision support for Interactive Brokers"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Kevin Lee" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "ib_async>=2.0,<3",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "pyyaml>=6,<7",
  "sqlalchemy>=2.0,<3",
  "streamlit>=1.40,<2",
  "tzdata>=2024.2",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "bandit==1.9.4",
  "detect-secrets==1.5.0",
  "hypothesis>=6.100,<7",
  "mypy>=1.13,<2",
  "pip-audit==2.10.1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
  "types-PyYAML>=6,<7",
]

[project.scripts]
chronos = "chronos.app:main"

[tool.setuptools.packages.find]
where = ["src"]

# The operator terminal's browser client (ADR-0018 §6) is data, not code.
# Package every non-hidden file at any depth; the release-artifact verifier
# independently discovers the source inventory and rejects packaging drift.
# Source: https://setuptools.pypa.io/en/stable/userguide/datafiles.html#package-data
[tool.setuptools.package-data]
"chronos.terminal" = ["static/*", "static/**/*"]
# Alembic's revision template is non-Python package data. Keep it with the
# installed migration namespace so the wheel carries the complete script tree.
# Source: https://setuptools.pypa.io/en/stable/userguide/datafiles.html#package-data
"chronos.persistence.migrations" = ["script.py.mako"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "ibkr: read-only integration tests that require a configured TWS or IB Gateway",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "DTZ", "RUF"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["T201"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["ib_async.*", "ibapi.*", "plotly.*", "streamlit.*"]
ignore_missing_imports = true
