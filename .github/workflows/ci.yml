name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BROKER_MODE: demo
      ALLOW_ORDER_TRANSMIT: "false"
      ALLOW_LIVE_TRADING: "false"
    steps:
      - name: Check out repository
        # v5.1.0: https://github.com/actions/checkout/releases/tag/v5.1.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Set up Python
        # v6.3.0: https://github.com/actions/setup-python/releases/tag/v6.3.0
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned, hash-verified dependencies
        run: |
          python -I scripts/verify_pip_bootstrap.py --lock requirements-bootstrap.lock --check-lock-only
          python -m pip install --disable-pip-version-check --no-deps --require-hashes -r requirements-bootstrap.lock
          python -I scripts/verify_pip_bootstrap.py --lock requirements-bootstrap.lock
          python -m pip install --require-hashes -r requirements-build.lock
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install -e . --no-deps --no-build-isolation --check-build-dependencies

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type-check
        run: mypy src/chronos

      - name: Type-check worker
        run: mypy --strict worker

      - name: Test
        run: pytest -q

      # Issue #154: the same supervisor safety tests, a second time, on the storage
      # topology production runs. Buys nothing against today's suite by measurement;
      # it goes red the first time a test starts depending on StaticPool's shared
      # connection, which is exactly the dependency that is invisible while green.
      - name: Test supervisor safety suites file-backed
        run: pytest tests/safety -q --file-backed-sqlite

      - name: Release security gate
        run: make security-gate PY=python

      - name: Validate release artifact
        run: python scripts/verify_release_artifact.py

      - name: Retain exact-main release evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # v7.0.1: https://github.com/actions/upload-artifact/releases/tag/v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: chronos-release-${{ github.sha }}
          path: |
            dist/chronos-*.whl
            dist/chronos-*.cdx.json
          if-no-files-found: error
          retention-days: 90

  release_provenance:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download exact-main release evidence
        # v8.0.1: https://github.com/actions/download-artifact/releases/tag/v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: chronos-release-${{ github.sha }}
          path: dist
          digest-mismatch: error

      - name: Attest exact-main release evidence
        # v4.2.2: https://github.com/actions/attest/releases/tag/v4.2.2
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            dist/chronos-*.whl
            dist/chronos-*.cdx.json
