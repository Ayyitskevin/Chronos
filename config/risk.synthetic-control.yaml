# Chronos platform risk policy — SYNTHETIC POSITIVE-CONTROL PROFILE (BACKTEST ONLY).
#
# This exists for ONE purpose: to let the research positive control
# (tests/safety/test_research_positive_control.py) run the real campaign pipeline over a
# generated corpus whose symbols are deliberately not real instruments.
#
# It is a field-for-field copy of `config/risk.research.yaml` with exactly one difference:
# `allowed_symbols`. The synthetic names are confined to this file so that the profile
# governing real research runs never contains a fake instrument — a test asserts both
# halves of that (the names are here, and they are absent from risk.research.yaml), and a
# second test asserts every other field still matches, so a change to the research profile
# that is not mirrored here fails loudly rather than drifting.
#
# Like the research profile it CANNOT transmit an order (ADR-0009 is a separate strict
# conjunction that no risk policy controls); it only governs which simulated proposals the
# backtest risk engine approves.

policy_version: "synthetic-control-1"

# The control universe. These are not tickers and cannot collide with a real instrument.
allowed_symbols: ["SYNTHA", "SYNTHB"]
allowed_strategy_ids:
  - "regime_trend_v1"
  - "mean_reversion_v1"
  - "baseline_buy_hold"
  - "baseline_sma_trend"
  - "baseline_random_entries"
allow_long_entries: true
allow_short_entries: false   # unsupported in this build

# Capital and exposure — research latitude (production policies re-impose real caps).
max_bot_capital_usd: 10000000
max_position_notional_usd: 10000000
max_aggregate_exposure_usd: 10000000
max_symbol_exposure_fraction: 1.0
max_risk_per_trade_fraction: 0.50
max_simultaneous_positions: 1
max_open_orders: 1

# Loss limits — permissive so a research sweep is not truncated mid-history.
max_daily_loss_usd: 3000
max_weekly_loss_usd: 3000
max_drawdown_fraction: 0.95
max_consecutive_losses: 1000

# Data freshness — 6 days, so weekend/holiday gaps in daily bars are not flagged stale.
max_quote_age_seconds: 518400
max_bar_age_seconds: 518400
max_price_deviation_fraction: 0.05

max_order_rejections_per_day: 100
cooldown_bars_after_loss_halt: 0

# Behavioral prohibitions — daily-bar strategies need overnight; everything else denied.
allow_market_orders: false
allow_margin: false
allow_overnight_positions: true
allow_averaging_down: false
allow_pyramiding: false
allow_options: false
