  "semantics": {
    "parity_status": "UNVERIFIED",
    "timing": [
      {
        "id": "closed-primary-bars",
        "rule": "Evaluate signals only after the primary chart bar is confirmed."
      },
      {
        "id": "next-bar-orders",
        "rule": "Pine process_orders_on_close=false: a market order created on a confirmed bar is eligible no earlier than the next bar."
      },
      {
        "id": "prior-completed-htf",
        "rule": "Higher-timeframe filters consume the prior completed HTF close and EMA; the in-progress HTF bar is never eligible."
      },
      {
        "id": "pivot-confirmation-lag",
        "rule": "Divergence pivots become observable piv_r primary bars after the pivot bar."
      },
      {
        "id": "history-pinned-markov",
        "rule": "Markov counts and dwell samples are path dependent. Every evaluation must pin an inclusive primary-history start timestamp."
      }
    ],
    "dependency_order": [
      {
        "ordinal": 1,
        "stage": "closed primary OHLCV",
        "depends_on": []
      },
      {
        "ordinal": 2,
        "stage": "benchmark and prior-completed higher-timeframe alignment",
        "depends_on": [
          "closed primary OHLCV"
        ]
      },
      {
        "ordinal": 3,
        "stage": "volatility, EMA, ADX/ER, RSI/MFI, ATR, and relative strength",
        "depends_on": [
          "closed primary OHLCV",
          "benchmark and prior-completed higher-timeframe alignment"
        ]
      },
      {
        "ordinal": 4,
        "stage": "raw and confirmed regime state",
        "depends_on": [
          "volatility, EMA, ADX/ER, RSI/MFI, ATR, and relative strength"
        ]
      },
      {
        "ordinal": 5,
        "stage": "Markov transitions, dwell history, and AVWAP anchors",
        "depends_on": [
          "raw and confirmed regime state"
        ]
      },
      {
        "ordinal": 6,
        "stage": "divergence and named long/short setup gates",
        "depends_on": [
          "volatility, EMA, ADX/ER, RSI/MFI, ATR, and relative strength",
          "Markov transitions, dwell history, and AVWAP anchors"
        ]
      },
      {
        "ordinal": 7,
        "stage": "entry decision, sizing plan, and exit updates",
        "depends_on": [
          "divergence and named long/short setup gates"
        ]
      }
    ],
    "warmups": [
      {
        "feature": "regime z-score",
        "requirement": "lookback + one return; volatility model may add its own seed"
      },
      {
        "feature": "volatility percentile adjustment",
        "requirement": "vol_percentile_len realized-volatility observations"
      },
      {
        "feature": "Mansfield relative strength",
        "requirement": "mans_len aligned bars"
      },
      {
        "feature": "benchmark and HTF EMA filters",
        "requirement": "their configured EMA history plus one completed HTF bar"
      },
      {
        "feature": "divergence",
        "requirement": "two confirmed pivots separated by min_gap..max_gap, each delayed piv_r"
      },
      {
        "feature": "Markov probability gates",
        "requirement": "configured row sample floor after the pinned history start"
      },
      {
        "feature": "dwell percentile gates",
        "requirement": "at least five completed spells for the current regime"
      },
      {
        "feature": "AVWAP",
        "requirement": "a qualifying anchor and a valid weighting observation"
      }
    ],
    "deviations": [
      {
        "id": "tradingview-owner-export",
        "classification": "verification gap",
        "status": "UNVERIFIED",
        "description": "No genuine owner-run TradingView export is checked in; synthetic fixtures can verify Chronos determinism but cannot establish platform parity."
      },
      {
        "id": "intrabar-fill-priority",
        "classification": "platform ambiguity",
        "status": "must-be-explicit",
        "description": "TradingView bar-magnifier fills and same-bar stop/target priority are not recoverable from bar-close exports; Chronos must label its fill policy."
      },
      {
        "id": "three-leg-milestones",
        "classification": "known Pine inference",
        "status": "must-not-copy-silently",
        "description": "The Pine script infers target milestones from leg absence. Chronos must retain explicit per-leg exit reason and milestone state."
      },
      {
        "id": "side-switch-attribution",
        "classification": "known Pine accounting risk",
        "status": "must-not-copy-silently",
        "description": "Blended sleeve attribution around side switches requires explicit side-owned fills and fees rather than position-sign inference."
      },
      {
        "id": "stop-guard-asymmetry",
        "classification": "known Pine asymmetry",
        "status": "documented",
        "description": "Long entry validation checks a positive stop price while short validation checks a positive stop distance; Chronos applies an explicit positive-distance rule."
      },
      {
        "id": "duplicate-alert-paths",
        "classification": "known Pine operational risk",
        "status": "must-not-copy",
        "description": "Static alertcondition and dynamic alert paths can describe the same event; Chronos emits one event identity per decision."
      },
      {
        "id": "profit-factor-infinity",
        "classification": "known Pine presentation sentinel",
        "status": "must-not-copy",
        "description": "Pine displays profit factor 999 when gross loss is zero; Chronos represents the value as undefined/infinite with explicit gross components."
      },
      {
        "id": "daily-loss-on-daily-bars",
        "classification": "known Pine semantic defect",
        "status": "must-not-copy-silently",
        "description": "On daily bars the script resets its day-start equity on every bar, making its daily-loss halt inert; Chronos records session semantics explicitly."
      },
      {
        "id": "long-plus-age-gate",
        "classification": "prose/code mismatch",
        "status": "source-code-authoritative",
        "description": "Despite comments describing optional bull age gating, strict LONG+ Markov mode also applies configured age and maturity ceilings; only the dwell gate is toggled."
      },
      {
        "id": "session-open-reconstruction",
        "classification": "data-model approximation",
        "status": "UNVERIFIED",
        "description": "Chronos bars expose close timestamps, so session/date gates reconstruct open time as close minus a fixed interval; daily bars and exchange-calendar discontinuities require a certified calendar-aware source."
      },
      {
        "id": "input-source-coverage",
        "classification": "external-series gap",
        "status": "must-be-explicit",
        "description": "External regime/strength sources remain caller-owned, and the AVWAP source supports only hlc3 or close unless a separately identified series is added."
      },
      {
        "id": "volume-gate-warmup",
        "classification": "source-code-authoritative",
        "status": "replicated",
        "description": "LONG+/SHORT+ volume-expansion gates pass while their moving average is na; Chronos preserves that source behavior and exposes it in tests."
      },
      {
        "id": "short-alert-setup-label",
        "classification": "known Pine alert defect",
        "status": "must-not-copy",
        "description": "Pine labels every short alert with the SHORT+ setup name even for legacy shorts; Chronos semantic events retain the selected setup identity."
      },
      {
        "id": "disconnected-execution-boundary",
        "classification": "implementation boundary",
        "status": "UNVERIFIED",
        "description": "The signal engine, pure planner/fill approximations, and closed-leg validation are not wired into one end-to-end replay, so execution parity is unverified."
      },
      {
        "id": "validation-evidence-subset",
        "classification": "research-evidence gap",
        "status": "blocked",
        "description": "Implemented validation is descriptive and does not execute every preregistered statistical, benchmark-alpha, multiplicity, or OOS-native risk gate."
      }
    ]
  },
